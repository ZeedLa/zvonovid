<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Видеочат на GitHub Pages</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; }
        .videos {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        video {
            width: 400px;
            max-width: 45vw;
            background: black;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        input, button {
            padding: 10px 15px;
            margin: 5px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        input { width: 200px; background: #444; color: white; }
        button { background: #007bff; color: white; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0056b3; }
        #myId { font-weight: bold; color: #4caf50; font-size: 1.2em; }
        .status { margin-top: 10px; font-style: italic; color: #aaa; }
    </style>
</head>
<body>

    <h1>Видеозвонки 1-на-1</h1>

    <div class="videos">
        <!-- Видео собеседника -->
        <video id="remoteVideo" autoplay playsinline></video>
        <!-- Твое видео -->
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <p>Твой ID для звонка: <span id="myId">Загрузка...</span></p>
        <p>Введи ID собеседника и нажми "Позвонить":</p>
        <input type="text" id="remotePeerId" placeholder="ID собеседника">
        <button id="callBtn">Позвонить</button>
        <div class="status" id="status">Инициализация...</div>
    </div>

    <!-- Подключаем PeerJS из CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const myIdDisplay = document.getElementById('myId');
        const callBtn = document.getElementById('callBtn');
        const statusDisplay = document.getElementById('status');
        
        let localStream;
        let peer;

        // 1. Запрашиваем доступ к камере и микрофону
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                
                // 2. Инициализируем PeerJS (подключаемся к их бесплатному серверу)
                peer = new Peer(); 

                peer.on('open', id => {
                    myIdDisplay.textContent = id;
                    statusDisplay.textContent = 'Готов к звонкам!';
                });

                // 3. Обработка ВХОДЯЩЕГО звонка
                peer.on('call', call => {
                    statusDisplay.textContent = 'Входящий звонок... Принимаем!';
                    call.answer(localStream); // Отвечаем, отдавая свое видео
                    
                    call.on('stream', remoteStream => {
                        remoteVideo.srcObject = remoteStream;
                        statusDisplay.textContent = 'На связи!';
                    });
                });

                peer.on('error', err => {
                    statusDisplay.textContent = 'Ошибка: ' + err.type;
                    console.error(err);
                });

            })
            .catch(err => {
                statusDisplay.textContent = 'Нет доступа к камере/микрофону!';
                console.error('Ошибка медиа:', err);
            });

        // 4. Обработка ИСХОДЯЩЕГО звонка
        callBtn.addEventListener('click', () => {
            const remotePeerId = document.getElementById('remotePeerId').value.trim();
            if (!remotePeerId) {
                alert('Введи ID собеседника!');
                return;
            }

            statusDisplay.textContent = 'Звоним...';
            const call = peer.call(remotePeerId, localStream);

            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                statusDisplay.textContent = 'На связи!';
            });

            call.on('close', () => {
                statusDisplay.textContent = 'Звонок завершен.';
                remoteVideo.srcObject = null;
            });
        });
    </script>
</body>
</html>
